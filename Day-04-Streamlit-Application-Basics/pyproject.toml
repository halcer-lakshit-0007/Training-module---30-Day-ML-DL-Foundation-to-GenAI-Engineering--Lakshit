[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-dashboard"
version = "1.0.0"
description = "Day 04 - Streamlit dashboard and FastAPI backend over the Day 03 support-ticket pipeline"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.39.0",
    "fastapi==0.115.0",
    "uvicorn==0.31.0",
    "python-multipart==0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.5", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Day 03's package is used from its own folder (never copied). It is normally
# installed with requirements.txt; the path below also lets pytest find it without that.
pythonpath = ["src", "../Day-03-Python-Engineering-Practices-Exceptions-Testing/src"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
mypy_path = "../Day-03-Python-Engineering-Practices-Exceptions-Testing/src"  # type-check against Day 03's source, not a copy

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "SIM"]

[tool.coverage.run]
source = ["ticket_dashboard", "ticket_api"]
branch = true

[tool.coverage.report]
show_missing = true
